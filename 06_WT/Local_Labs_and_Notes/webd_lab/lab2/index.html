<!DOCTYPE html>
<html>
<head>
    <title>Three Types of CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .internal {
            color: green;
            font-size: 24px;
            background-color: lightyellow;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Three Types of CSS</h1>

    <p style="color: red; font-size: 24px; background-color: lightblue; padding: 10px;">
        This paragraph uses Inline CSS.
    </p>

    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <p class="external">
        This paragraph uses External CSS.
    </p>

</body>
</html>
